<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Crypto AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0B0E14;
      color: white;
      text-align: center;
    }
    header {
      padding: 60px 20px;
    }
    h1 {
      font-size: 42px;
    }
    section {
      padding: 40px 20px;
    }
  </style>
</head>

<body>

<header>
  <h1>Crypto AI</h1>
  <p>Plateforme crypto en temps réel</p>
</header>

<section>
  <!-- FLUX CRYPTO ICI -->
  <iframe 
    src="https://s.tradingview.com/embed-widget/ticker-tape/?locale=fr#{
    %22symbols%22:[
      {%22proName%22:%22BINANCE:BTCUSDT%22,%22title%22:%22Bitcoin%22},
      {%22proName%22:%22BINANCE:ETHUSDT%22,%22title%22:%22Ethereum%22},
      {%22proName%22:%22BINANCE:SOLUSDT%22,%22title%22:%22Solana%22}
    ],
    %22colorTheme%22:%22dark%22,
    %22isTransparent%22:true,
    %22displayMode%22:%22adaptive%22
  }"
    width="100%"
    height="60"
    frameborder="0">
  </iframe>
</section>

</body>
</html>
